announce:
  name: Announce
  description: >-
    Play an announcement on a TTS Bridge device. Provide message, url, or
    both (url plays; message is kept as a fallback/label). At least one is
    required.
  target:
    entity:
      domain: notify
      integration: ttsbridge
  fields:
    message:
      name: Message
      description: Text to speak via the bridge's own engine chain (device TTS by default).
      example: "Someone's at the door"
      selector:
        text:
    url:
      name: Audio URL
      description: >-
        A pre-rendered audio URL (e.g. from Home Assistant's own TTS
        engines) to play directly, bypassing the bridge's engine selection.
      example: "http://192.168.2.104:8123/api/tts_proxy/abc123.mp3"
      selector:
        text:
    priority:
      name: Priority
      description: Emergency always interrupts whatever's currently playing.
      default: normal
      selector:
        select:
          options:
            - emergency
            - high
            - normal
            - low
    category:
      name: Category
      description: Used for duplicate-suppression and staleness rules (e.g. "motion", "doorbell").
      default: general
      selector:
        text:
    engine:
      name: Engine (bridge-native)
      description: >-
        Either a bridge-native engine id (e.g. "device", or anything
        registered via POST /engines - only relevant when no url/tts_engine
        is given, falls through to the default chain then device on
        failure), or a manually-typed "tts.<entity>" id as an alternative
        to using the TTS Engine field below. If both are set, TTS Engine
        wins.
      selector:
        text:
    tts_engine:
      name: TTS Engine
      description: >-
        Pick an installed Home Assistant TTS entity to render the message
        through (Piper, Google Translate, Homeway Sage, etc.) and play the
        result directly, bypassing the bridge's own engine chain entirely.
      selector:
        entity:
          domain: tts
    chime:
      name: Chime
      description: >-
        Prepend a short chime before the message. Only works together with
        TTS Engine (or a manually-typed engine set to a tts.<entity> id) -
        ignored otherwise, with a warning in the log. The value is an id,
        not a filename: drop an mp3 at
        config/www/ttsbridge_chimes/<id>.mp3 and use <id> here, e.g.
        "doorbell" for ttsbridge_chimes/doorbell.mp3. Swapping that file
        later automatically invalidates cached copies of anything that
        used it - no separate cache-clearing needed.
      example: "doorbell"
      selector:
        text:
    speak_timeout:
      name: Playback timeout (ms)
      description: Hard ceiling on how long this announcement is allowed to play. Omit to use the bridge's default.
      selector:
        number:
          min: 1000
          max: 120000
          unit_of_measurement: ms

cancel:
  name: Cancel
  description: >-
    Stop whatever this bridge device is currently playing. With clear_queue
    (the default), also drops everything still queued behind it - use this
    to actually halt a runaway batch of announcements, since stopping an
    automation or script that's feeding announce calls only stops it from
    queuing *new* ones; anything already queued keeps playing on its own
    until this is called.
  target:
    entity:
      domain: notify
      integration: ttsbridge
  fields:
    clear_queue:
      name: Clear queue
      description: >-
        If true (default), also discard everything still waiting to play,
        not just the current announcement.
      default: true
      selector:
        boolean:

check_cache:
  name: Check cache
  description: >-
    Look up whether this exact (message, tts_engine, chime) combination is
    already cached, WITHOUT calling the engine or costing any quota either
    way. Returns cached: true/false, and a url when true. Use this to
    decide what to actually announce - e.g. check a raw SSML version, then
    a plain-text version, and only fall through to a real announce (which
    will cost quota on a miss) if neither is already cached.
  target:
    entity:
      domain: notify
      integration: ttsbridge
  fields:
    message:
      name: Message
      description: The exact message text to check (must match verbatim - SSML tags included/excluded matters).
      required: true
      selector:
        text:
    tts_engine:
      name: TTS engine
      description: The tts.* entity this would be rendered through.
      required: true
      selector:
        entity:
          domain: tts
    chime:
      name: Chime
      description: >-
        Chime id, matching what a real announce call would use. Required
        to get a real answer - without it this always returns cached=false,
        since chimes are the only cache this checks.
      selector:
        text:
